[package]
name = "vrac-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Keyboard-first terminal client for Vrac"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
dirs = "6.0.0"
jiff = "0.2.34"
tempfile = "3.27.0"
unicode-width = "0.2.2"
vrac = { package = "vrac-engine", path = "../vrac-engine", version = "0.1.0" }

[dev-dependencies]
libc = "0.2"
