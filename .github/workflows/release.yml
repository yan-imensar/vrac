name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Match tag to workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add ${{ matrix.target }}

      - name: Install Linux build tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Vrac
        run: cargo build --release --locked --package vrac --target ${{ matrix.target }}

      - name: Package Vrac
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: vrac-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.extension }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/vrac" dist/package/vrac
          cp LICENSE dist/package/LICENSE
          tar -C dist/package -czf "dist/$ASSET" vrac LICENSE
          shasum -a 256 "dist/$ASSET" | sed 's#  dist/#  #' > "dist/$ASSET.sha256"

      - name: Package Vrac
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: vrac-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.extension }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/vrac.exe" dist/package/vrac.exe
          Copy-Item LICENSE dist/package/LICENSE
          Compress-Archive -Path dist/package/vrac.exe, dist/package/LICENSE -DestinationPath "dist/$env:ASSET"
          $hash = (Get-FileHash "dist/$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Set-Content -NoNewline "dist/$env:ASSET.sha256"

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/vrac-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Add the curl installer
        shell: bash
        run: cp install.sh dist/vrac-installer.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "Vrac $GITHUB_REF_NAME"
